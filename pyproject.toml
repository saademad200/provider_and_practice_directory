[project]
name = "provider-practice-directory-update-pipeline"
version = "0.1.0"
description = "Option C hybrid provider/practice directory update pipeline submission."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
