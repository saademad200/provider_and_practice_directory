<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider Directory Operations Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16202a;
      --muted: #63717f;
      --line: #d8e0e8;
      --page: #f5f7fa;
      --panel: #fff;
      --blue: #1e6b9e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    main { max-width: 1500px; margin: 0 auto; padding: 20px 24px 28px; }
    .subtle { color: var(--muted); font-size: 13px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(7, minmax(112px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 74px;
      padding: 12px;
    }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .metric strong { font-size: 22px; letter-spacing: 0; }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.mini {
      height: 28px;
      padding: 0 8px;
      font-size: 12px;
      margin: 0 4px 4px 0;
      white-space: nowrap;
    }
    button.accept { border-color: #7fb685; color: #226032; }
    button.reject { border-color: #d99696; color: #8a2d2d; }
    button.recrawl { border-color: #9eb9cf; color: #1e5d86; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .section-head {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf1f5;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    th {
      background: #fbfcfd;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    tbody tr:hover td { background: #f8fbfd; }
    td.actions { min-width: 190px; }
    .empty { padding: 24px; color: var(--muted); }
    @media (max-width: 1000px) {
      header { align-items: flex-start; flex-direction: column; }
      .metrics { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>

    <div>

  </header>

    const views = [
      ['review', 'Review Queue', 'Prioritized uncertain updates with source freshness and review reasons.'],
      ['inactive', 'Inactive Providers', 'Lifecycle candidates for retired, deactivated, or closed-provider review.'],
      ['llm', 'LLM Fallback', 'Bedrock fallback gate and grounding validation fixture.'],
      ['rollback', 'Rollback Plan', 'Inverse commands for auto-applied updates.']
    ];
    const metricItems = [
      ['F1', data.metrics.f1],
      ['Precision', data.metrics.precision],
      ['Recall', data.metrics.recall],
      ['Auto Precision', data.metrics.auto_apply_precision],
      ['Review', data.counts.review],
      ['Inactive', data.counts.inactive],
      ['Rollback', data.counts.rollback]
    ];
    document.getElementById('metrics').innerHTML = metricItems.map(([label, value]) =>
      `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`
    ).join('');
    const tabs = document.getElementById('tabs');
    const title = document.getElementById('title');
    const caption = document.getElementById('caption');
    const table = document.getElementById('table');
    let active = 'review';
    function render() {
      tabs.innerHTML = views.map(([key, label]) =>
        `<button class="${key === active ? 'active' : ''}" data-key="${key}">${label}</button>`
      ).join('');
      const view = views.find(([key]) => key === active);
      title.textContent = view[1];
      caption.textContent = view[2];
      table.innerHTML = data.tables[active];
      enhanceTable(active);
      tabs.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
        active = button.dataset.key;
        render();
      }));
    }
    function enhanceTable(viewKey) {
      const tableElement = table.querySelector('table');
      if (!tableElement || !['review', 'inactive'].includes(viewKey)) return;
      const headRow = tableElement.querySelector('thead tr');
      if (headRow && !headRow.querySelector('[data-actions-head]')) {
        const th = document.createElement('th');
        th.textContent = 'Action';
        th.dataset.actionsHead = 'true';
        headRow.appendChild(th);
      }
      tableElement.querySelectorAll('tbody tr').forEach((row, index) => {
        if (row.querySelector('.actions')) return;
        const cell = document.createElement('td');
        cell.className = 'actions';
        cell.innerHTML = viewKey === 'review'
          ? '<button class="mini accept" data-review-action="accept">Accept</button><button class="mini reject" data-review-action="reject">Reject</button><button class="mini recrawl" data-review-action="recrawl">Recrawl</button>'
          : '<button class="mini reject" data-review-action="suppress">Suppress</button><button class="mini recrawl" data-review-action="verify">Verify</button>';
        row.appendChild(cell);
      });
      tableElement.querySelectorAll('[data-review-action]').forEach(button => {
        button.addEventListener('click', () => {
          button.closest('tr').dataset.selectedAction = button.dataset.reviewAction;
        });
      });
    }
    render();
